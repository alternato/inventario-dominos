<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/volta-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOLTA - Inventario Domino's Pizza Chile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Limpieza única: desregistra Service Workers antiguos (PWA) y borra sus cachés
      // para evitar que sirvan bundles/datos de inventario obsoletos. Seguro y silencioso.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
              .catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
          }
        } catch (e) { /* noop */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
